name: Deploy approved GitHub Pages site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build committed approved snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality and fixture gates
        run: pnpm quality

      - name: Build and verify committed approved snapshot
        run: pnpm publication:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: false

      - name: Upload verified static Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          retention-days: 30

  deploy:
    name: Deploy through protected environment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check out expected approved snapshot
        uses: actions/checkout@v6

      - name: Set up pinned Node.js for live verification
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify canonical HTTPS deployment
        run: node site/scripts/verify-deployed-site.ts --attempts 12 --delay-ms 5000
